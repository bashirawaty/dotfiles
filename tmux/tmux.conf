# ------------------------------------------------------------------------------
# tmux.conf — cross‑platform tmux configuration for Linux + macOS.
# Includes mouse support, modern keybindings, clipboard integration,
# and a clean status bar.
# ------------------------------------------------------------------------------

# Basics
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# Prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits
bind | split-window -h
bind - split-window -v

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-bg black
set -g status-fg white
set -g status-left '#[fg=green]#S #[fg=cyan]#I:#P#[default]'
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M #[fg=magenta]#(whoami)#[default]'

# Clipboard integration
# macOS
if -b 'command -v pbcopy >/dev/null 2>&1' \
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Linux (xclip)
if -b 'command -v xclip >/dev/null 2>&1' \
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Fallback
bind -T copy-mode-vi Y send-keys -X copy-selection

# Colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
