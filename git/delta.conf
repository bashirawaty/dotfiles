# ------------------------------------------------------------------------------
# Git Delta — beautiful diffs with syntax highlighting.
# ------------------------------------------------------------------------------

[core]
    pager = delta

[interactive]
    diffFilter = delta --color-only

[delta]
    line-numbers = true
    syntax-theme = Dracula
    navigate = true
    side-by-side = true
    hyperlinks = true

[merge]
    conflictstyle = diff3

[diff]
    colorMoved = default
