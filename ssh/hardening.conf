# ------------------------------------------------------------------------------
# SSH Hardening — secure defaults for all hosts
# ------------------------------------------------------------------------------

Host *
    Protocol 2                      # Disable SSHv1
    KexAlgorithms curve25519-sha256@libssh.org,diffie-hellman-group14-sha256
    Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
    MACs hmac-sha2-512,hmac-sha2-256

    PasswordAuthentication no       # Disable password login
    PubkeyAuthentication yes        # Only allow key-based login
    ChallengeResponseAuthentication no
    GSSAPIAuthentication no

    ForwardAgent no                 # Prevent credential theft
    ForwardX11 no                   # Disable X11 forwarding
    PermitLocalCommand no

    ServerAliveInterval 30          # Keep connection alive
    ServerAliveCountMax 5

    HashKnownHosts yes              # Hash hostnames for privacy
    AddKeysToAgent yes              # Auto-add keys to agent
    UseKeychain yes                 # macOS keychain integration

    ControlMaster auto              # Reuse SSH connections
    ControlPersist yes              # Keep master connection alive
    ControlPath ~/.ssh/ctl-%r@%h:%p # Multiplexing path
