# ------------------------------------------------------------------------------
# SSH Host Templates — copy/paste to create new hosts quickly
# ------------------------------------------------------------------------------

# Template: simple host
Host <name>
    HostName <hostname-or-ip>
    User <username>
    IdentityFile ~/.ssh/<keyfile>
    Port <port>

# Template: host with jump/bastion
Host <name>
    HostName <internal-host>
    User <username>
    ProxyJump <bastion-host>
    IdentityFile ~/.ssh/<keyfile>

# Template: Git server
Host <name>
    HostName <git-server>
    User git
    IdentityFile ~/.ssh/id_ed25519
